name: Publish Contract

on:
  push:
    tags:
      - v*.*.*/contract

jobs:
  publish:
    name: Publish Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Prepare
        run: rm -f package-lock.json .npmrc
        shell: bash

      - name: Install dependencies
        run: npm install
        shell: bash

      - name: Build packages
        run: npx nx run-many --target=build --projects=grpc,grpc-node-client,grpc-web-client
        shell: bash

      - name: Publish packages
        run: npx nx release publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
