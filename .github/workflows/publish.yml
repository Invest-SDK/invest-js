name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example 1.60.0)'
        required: true
        type: string

jobs:
  publish:
    name: Publish
    # A mirror can overwrite existing tags when histories are reconciled.
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          filter: tree:0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Prepare
        run: rm -f package-lock.json .npmrc
        shell: bash

      - name: Verify npm authentication
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Set the NPM_ACCESS_TOKEN repository secret to a granular npm token with read/write access to the @ttech-pub packages."
            exit 1
          fi
          if ! npm whoami --registry=https://registry.npmjs.org/ --fetch-retries=0 > /dev/null; then
            echo "::error::npm authentication failed. Check NPM_ACCESS_TOKEN validity and the registry error above."
            exit 1
          fi
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Install dependencies
        run: npm install
        shell: bash

      - name: Update stub versions
        run: node .github/scripts/update-versions.js
        shell: bash

      - name: Build packages
        run: npm run build:all
        shell: bash

      - name: Publish packages
        id: publish
        run: npm run publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_LOGS_DIR: ${{ runner.temp }}/npm-publish-logs

      # Nx 20 discards npm stderr, including additional registry diagnostics.
      - name: Show npm publish diagnostics
        if: failure() && steps.publish.outcome == 'failure'
        run: cat "$NPM_CONFIG_LOGS_DIR"/*-debug-*.log
        shell: bash
        env:
          NPM_CONFIG_LOGS_DIR: ${{ runner.temp }}/npm-publish-logs
