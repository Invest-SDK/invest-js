name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Prepare
        run: rm -f package-lock.json .npmrc
        shell: bash

      - name: Install dependencies
        run: npm install
        shell: bash

      - name: Update stub versions
        run: node .github/scripts/update-versions.js
        shell: bash

      - name: Build packages
        run: npm run build:all
        shell: bash

      - name: Publish packages
        run: npm run publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
